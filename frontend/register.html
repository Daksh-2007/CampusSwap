<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CampusSwap</title>
  <meta name="description" content="Register for a CampusSwap account to buy, sell, and exchange college essentials safely within your campus.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Auth Styles -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Brand Header -->
      <header class="text-center mb-4">
        <a href="index.html" class="text-decoration-none">
          <div class="brand-badge mb-2">
            <i class="bi bi-arrow-left-right"></i>
          </div>
        </a>
        <h1 class="h3 brand-title mb-1">CampusSwap</h1>
        <p class="text-secondary small mb-0">Join your campus student marketplace</p>
      </header>

      <!-- Registration Card -->
      <div class="card glass-card p-4">
        
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-3 border-secondary border-opacity-25">
          <h2 class="h5 fw-bold text-white mb-0">
            <i class="bi bi-person-plus text-primary me-2"></i>Create an Account
          </h2>
          <span class="badge bg-primary bg-opacity-25 text-info border border-info border-opacity-25">Student</span>
        </div>

        <!-- Alert Container -->
        <div id="registerAlert" class="alert d-none mb-3" role="alert" aria-live="polite"></div>

        <!-- Registration Form -->
        <form id="registerForm" novalidate>
          
          <!-- Full Name -->
          <div class="mb-3">
            <label for="fullName" class="form-label">
              Full Name <span class="required-star">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input 
                type="text" 
                class="form-control" 
                id="fullName" 
                name="fullName" 
                placeholder="Alex Morgan" 
                required 
                autocomplete="name"
              >
            </div>
            <div class="helper-text">Enter your first and last name</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">
              College Email Address <span class="required-star">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input 
                type="email" 
                class="form-control" 
                id="email" 
                name="email" 
                placeholder="student@university.edu" 
                required 
                autocomplete="email"
              >
            </div>
            <div class="helper-text">Use your valid campus or student email</div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">
              Password <span class="required-star">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password" 
                placeholder="Minimum 8 characters" 
                minlength="8" 
                required 
                autocomplete="new-password"
              >
              <button 
                type="button" 
                class="input-group-text password-toggle-btn" 
                data-toggle-password="password" 
                aria-label="Toggle password visibility"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="helper-text">Must be at least 8 characters long</div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">
              Confirm Password <span class="required-star">*</span>
            </label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
              <input 
                type="password" 
                class="form-control" 
                id="confirmPassword" 
                name="confirmPassword" 
                placeholder="Re-enter your password" 
                minlength="8" 
                required 
                autocomplete="new-password"
              >
              <button 
                type="button" 
                class="input-group-text password-toggle-btn" 
                data-toggle-password="confirmPassword" 
                aria-label="Toggle confirm password visibility"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="registerSubmitBtn" class="btn btn-primary-action mt-2">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="registerSpinner" role="status" aria-hidden="true"></span>
            <span id="registerBtnText">Create Account</span>
          </button>

        </form>

        <!-- Link to Login -->
        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <p class="text-secondary small mb-0">
            Already have an account? 
            <a href="login.html" class="auth-nav-link fw-semibold ms-1">
              Sign In <i class="bi bi-arrow-right-short"></i>
            </a>
          </p>
        </div>

      </div>

      <!-- Backend Connection Footer -->
      <footer class="text-center mt-4">
        <small class="text-secondary">
          Backend API: <code class="text-info">http://localhost:5000</code> &bull;
          <a href="#" id="checkHealthBtn" class="auth-nav-link small">Check API Health</a>
        </small>
        <div id="healthStatus" class="mt-1 small"></div>
      </footer>

    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom Authentication Script -->
  <script src="js/auth.js"></script>
</body>
</html>
